name: Release

on: push

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Package
        run: sh package.sh

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vrm_rigify.zip
          # Tags with a suffix (e.g. v0.4.1-rc.1) publish as a pre-release so
          # they never become the "latest" release; plain version tags do not.
          prerelease: ${{ contains(github.ref_name, '-') }}
